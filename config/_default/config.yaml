baseURL: 'https://fortmea.tech/'
pagination:
  pagerSize: 5
env: production
defaultContentLanguage: 'pt'
theme: "PaperMod"
enableEmoji: true
services:
  googleAnalytics:
    id: 'G-YEJE75S730'
params:
  subtitle: 'minha página pessoal'
  contact:
    email: 'joao.amadeu@unifio.edu.br'
  contentTypeName: "posts"
  keywords: [Blog, Portfolio, fortmea, programação, dev, android, flutter]
  showMenuItems: 2
  ShowFullTextinRSS: true
  showLanguageSelector: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false
  defaultTheme: dark
  images: ["og-image.jpg"]
  profileMode:
    enabled: true 
    imageUrl: "posts/images/eu.webp"
    imageWidth: 120
    imageHeight: 120

outputs:
  home:
    - HTML
    - RSS
    - JSON
markup:
  defaultMarkdownHandler: 'goldmark'
  goldmark:
    unsafe: true 
    duplicateResourceFiles: false
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: 'https'
      strikethrough: true
      table: true
      taskList: true
      cjk:
        eastAsianLineBreaks: false
        eastAsianLineBreaksStyle: 'simple'
        enable: false
        escapedSpace: false
      extras:
        delete:
          enable: false
        insert:
          enable: false
        mark:
          enable: false
        subscript:
          enable: false
        superscript:
          enable: false
      passthrough:
        enable: false
        delimiters:
          block: []
          inline: []
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      autoDefinitionTermID: false
      autoHeadingID: true
      autoIDType: 'github'
      wrapStandAloneImageWithinParagraph: true
      attribute:
        block: false
        title: true
    renderHooks:
      goldmark:
        renderHooks:
          image:
            enableDefault: false
          link:
            enableDefault: false
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

languages:
  pt:
    languageName: "Português"
    title: "joão walter amadeu"
    params:
      subtitle: "Minha página pessoal"
      profileMode:
        title: joão walter amadeu
        subtitle: "Dev mobile. Sistemas embarcados, self-hosting, eletrônica e carros."
        imageTitle: "João sentado no sofá, comendo um pedaço de bolo de aniversário"
        buttons:
          - name: Postagens
            url: posts
          - name: Tags
            url: tags
          - name: Pesquisar
            url: search
      socialIcons:
        - name: github
          title: Meu Github
          url: "https://github.com/fortmea"
        - name: LinkedIn
          title: Meu LinkedIn
          url: "https://www.linkedin.com/in/joao-walter-amadeu/"
        - name: rss
          title: RSS
          url: "/index.xml"
    menu:
      main:
        - identifier: "about"
          name: "Sobre"
          url: "/about"
  en:
    languageName: "English"
    title: "joão walter amadeu"
    params:
      subtitle: "My personal page"
      menuMore: "Show more"
      readMore: "Read more"
      readOtherPosts: "Other posts"
      profileMode:
        title: joão walter amadeu
        subtitle: "Mobile dev. Embedded systems, self-hosting, electronics and cars."
        imageTitle: "João sitting on a couch, eating a slice of birthday cake"
        buttons:
          - name: Posts
            url: posts
          - name: Tags
            url: tags
          - name: Search
            url: search
      socialIcons:
        - name: github
          title: My github profile
          url: "https://github.com/fortmea"
        - name: LinkedIn
          title: My linkedin profile
          url: "https://www.linkedin.com/in/joao-walter-amadeu/"
        - name: rss
          title: RSS
          url: "/en/index.xml"
    menu:
      main:
        - identifier: "about"
          name: "About"
          url: "/about"
